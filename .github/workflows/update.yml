name: Collect broadcast snapshot
run-name: Collect broadcast snapshot (${{ github.event_name == 'workflow_dispatch' && inputs.cloudflare && 'cloudflare' || github.event_name }})
on:
  workflow_dispatch:
    inputs:
      cloudflare:
        description: Use the automatic collection path for Cloudflare Cron
        type: boolean
        default: false
  push:
    branches: [main]
  schedule:
    # UTC 15–23 and 00–07 = JST 00–16; UTC 08–14 = JST 17–23.
    - cron: '17 0-7,15-23 * * *'
    - cron: '7,22,37,52 8-14 * * *'
    # Extra opportunity on the same scheduler. Collect only when Pages is stale.
    - cron: '32 * * * *'
permissions:
  contents: read
concurrency:
  group: broadcast-snapshot-production
  cancel-in-progress: false
jobs:
  check_backup:
    if: github.event_name == 'schedule' && github.event.schedule == '32 * * * *' && github.repository == 'elrain1999/gesen-live' && github.event.repository.private == false && github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      refresh: ${{ steps.freshness.outputs.refresh }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: freshness
        run: node scripts/check-schedule-backup.cjs
  collect:
    needs: check_backup
    if: >-
      !cancelled() && (github.event_name != 'schedule' ||
      github.event.schedule != '32 * * * *' ||
      (needs.check_backup.result != 'skipped' && needs.check_backup.outputs.refresh != 'false'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      deployable: ${{ steps.snapshot.outputs.deployable }}
      acquired: ${{ steps.acquisition.outcome == 'success' }}
    env:
      CACHE_SCOPE: ${{ github.ref_name }}
      AUTOMATED_COLLECTION: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.cloudflare == true) }}
    steps:
      - name: Log trigger
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          printf 'Trigger: %s %s (automatic=%s)\n' "$TRIGGER_EVENT" "$TRIGGER_CRON" "$AUTOMATED_COLLECTION"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/streams.json
            data/fetch-state.json
          key: stream-v6-${{ env.CACHE_SCOPE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: stream-v6-${{ env.CACHE_SCOPE }}-
      - name: Restore freshest published data
        if: github.repository == 'elrain1999/gesen-live' && github.ref == 'refs/heads/main'
        run: node scripts/snapshot-guard.cjs restore
      - name: Check recent automatic collection
        id: recent
        if: env.AUTOMATED_COLLECTION == 'true' && github.repository == 'elrain1999/gesen-live' && github.ref == 'refs/heads/main'
        run: node scripts/collection-mode.mjs
        env:
          PUBLISH_PAGES: ${{ vars.PUBLISH_PAGES }}
      - run: npm run probe:auth
        if: env.AUTOMATED_COLLECTION != 'true'
      - name: Reserve shared search budget
        if: steps.recent.outputs.mode != 'reuse' && steps.recent.outputs.mode != 'skip'
        run: node scripts/search-budget.cjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run validate:api
        id: acquisition
        if: steps.recent.outputs.mode != 'reuse' && steps.recent.outputs.mode != 'skip'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      # Save quota/ID state immediately after collection, even if a later test fails.
      - uses: actions/cache/save@v4
        if: steps.recent.outputs.mode != 'reuse' && steps.recent.outputs.mode != 'skip'
        with:
          path: |
            data/streams.json
            data/fetch-state.json
          key: stream-v6-${{ env.CACHE_SCOPE }}-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm run audit:youtube
        if: steps.recent.outputs.mode != 'skip'
        env:
          REQUIRE_OWNERSHIP: '1'
      - run: npm run build && npm test
        if: steps.recent.outputs.mode != 'skip'
      - name: Check collected data
        id: snapshot
        if: steps.recent.outputs.mode != 'skip'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const {visible_now} = require('./artifacts/youtube-audit.json');
          const snapshot = require('./data/streams.json');
          const hasRecords = visible_now.total > 0;
          const status = snapshot.providers.YouTube.status;
          const deployable = status === 'ok' || (['partial', 'error'].includes(status) && (hasRecords || snapshot.last_success_at));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_records=${hasRecords}\ndeployable=${Boolean(deployable)}\n`);
          console.log(`YouTube status: ${status}; displayable records: ${visible_now.total}`);
          NODE
      - run: npm run prepare:https-preview
        if: steps.snapshot.outputs.has_records == 'true'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
        if: env.AUTOMATED_COLLECTION != 'true'
      - run: npx playwright install --with-deps chromium
        if: env.AUTOMATED_COLLECTION != 'true'
      - run: npm run test:browser
        if: env.AUTOMATED_COLLECTION != 'true'
      - uses: actions/upload-artifact@v4
        if: always() && env.AUTOMATED_COLLECTION != 'true'
        with:
          name: youtube-real-browser-screenshots
          path: artifacts/*.png
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: steps.snapshot.outputs.has_records == 'true'
        with:
          name: youtube-browser-preview
          path: artifacts/youtube-preview.html
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: steps.snapshot.outputs.has_records == 'true'
        with:
          name: https-preview-candidate
          path: artifacts/https-preview/index.html
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: steps.recent.outputs.mode != 'skip'
        with:
          name: portal-dist
          path: dist/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always() && steps.recent.outputs.mode != 'skip'
        with:
          name: api-validation
          path: |
            data/api-validation.json
            data/search-reservation.json
            artifacts/auth-probe.json
            artifacts/youtube-audit.json
            artifacts/browser-real-data.json
            artifacts/file-preview-validation.json
            artifacts/https-preview-report.json
            artifacts/https-preview-browser.json
          retention-days: 1

      - name: Refuse stale publication
        if: github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true' && steps.snapshot.outputs.deployable == 'true'
        run: node scripts/snapshot-guard.cjs publish
      - uses: actions/upload-pages-artifact@v3
        if: github.event.repository.private == false && github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true' && steps.snapshot.outputs.deployable == 'true'
        with:
          path: dist/
  deploy:
    needs: collect
    if: >-
      !cancelled() && needs.collect.result == 'success' &&
      github.event.repository.private == false && github.ref == 'refs/heads/main' &&
      vars.PUBLISH_PAGES == 'true' && needs.collect.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  acquisition_status:
    needs: [collect, deploy]
    if: always() && needs.collect.result == 'success' && needs.collect.outputs.acquired == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: api-validation
          path: report
      - name: Report partial acquisition after publication
        run: node scripts/check-acquisition.cjs
