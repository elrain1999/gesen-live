name: Deploy scheduler Worker
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gesen-live-scheduler
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'elrain1999/gesen-live' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --prefix "$RUNNER_TEMP/scheduler-wrangler" --no-save --package-lock=false wrangler@4.167.0
      - name: Update and verify the existing Worker
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node cloudflare/check-deployment.mjs preflight
          "$RUNNER_TEMP/scheduler-wrangler/node_modules/.bin/wrangler" deploy --config cloudflare/wrangler.toml --name gesen-live-scheduler --keep-vars
          node cloudflare/check-deployment.mjs verify
